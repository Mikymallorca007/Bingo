<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTISERVICIOS - PEDRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #1e1e1e; padding: 15px; text-align: center; border-bottom: 2px solid #00d4ff; }
        header h1 { margin: 0; font-size: 1rem; color: #00d4ff; }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* Botón de Activación Inicial */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #btn-start { padding: 20px 40px; background: #00d4ff; border: none; border-radius: 50px; font-weight: 900; font-size: 1.2rem; cursor: pointer; }

        /* Estado Libre */
        .status-free { text-align: center; opacity: 0.4; }
        .status-free h1 { font-size: 4rem; margin: 0; }

        /* Tarjeta de Tarea */
        #task-card { 
            display: none; width: 100%; max-width: 400px; 
            background: #f1c40f; color: #121212; padding: 30px; border-radius: 30px; 
            text-align: center; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0px #f1c40f; } 50% { box-shadow: 0 0 30px #f1c40f; } 100% { box-shadow: 0 0 0px #f1c40f; } }

        .detail { margin: 20px 0; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; }
        .detail label { font-size: 0.7rem; font-weight: 900; opacity: 0.6; }
        .detail span { font-size: 1.4rem; font-weight: 800; display: block; }

        .btn-done { width: 100%; padding: 20px; background: #121212; color: white; border: none; border-radius: 20px; font-size: 1.2rem; font-weight: 900; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="overlay">
        <p>PARA RECIBIR AVISOS SONOROS:</p>
        <button id="btn-start" onclick="activarAudio()">ACTIVAR SISTEMA</button>
    </div>

    <header>
        <h1>TRABAJADOR: PEDRO</h1>
    </header>

    <main>
        <div id="no-task" class="status-free">
            <h1>🛰️</h1>
            <p>SISTEMA ESCUCHANDO...</p>
        </div>

        <div id="task-card">
            <h2 style="margin:0">⚠️ NUEVA ORDEN</h2>
            <div class="detail">
                <label>CLIENTE</label>
                <span id="cli-name"></span>
            </div>
            <div class="detail">
                <label>TAREA</label>
                <span id="task-desc"></span>
            </div>
            <button class="btn-done" onclick="finalizar()">FINALIZAR TRABAJO</button>
        </div>
    </main>

    <script>
        const firebaseConfig = { 
            databaseURL: "https://tokentest-87f09-default-rtdb.europe-west1.firebasedatabase.app" 
            // NOTA: Para que las notificaciones funcionen, aquí deberás pegar tu configuración 
            // completa (apiKey, appId, etc.) de la consola de Firebase.
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messaging = firebase.messaging();

        let audioContext;

        // Función para permitir el audio al inicio e implementar Notificaciones Push
        function activarAudio() {
            // Lógica de AudioContext original
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Implementación de Permisos de Notificación y Token
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    console.log('PERMISO CONCEDIDO');
                    // Obtener el Token (la dirección única del móvil de Pedro)
                    // REEMPLAZA 'TU_CLAVE_VAPID_PUBLICA' por la de tu consola de Firebase
                    messaging.getToken({ vapidKey: 'TU_CLAVE_VAPID_PUBLICA' })
                        .then((currentToken) => {
                            if (currentToken) {
                                // Guardamos el token en Firebase
                                db.ref('trabajadores/pedro/token').set(currentToken);
                            }
                        }).catch((err) => {
                            console.log('Error al obtener token', err);
                        });
                }
            });

            document.getElementById('overlay').style.display = 'none';
            // Sonido de confirmación corto
            reproducirPitido(440, 0.1); 
        }

        // Función que crea un pitido electrónico (sin archivos externos)
        function reproducirPitido(frecuencia = 880, duracion = 0.5) {
            if (!audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = frecuencia;
            gain.gain.setValueAtTime(0.1, audioContext.currentTime);
            osc.start();
            osc.stop(audioContext.currentTime + duracion);
        }

        // Escuchar Firebase
        db.ref('trabajadores/pedro/servicio_actual').on('value', (snap) => {
            const data = snap.val();
            if (data && data.estado === "pendiente") {
                document.getElementById('no-task').style.display = "none";
                document.getElementById('task-card').style.display = "block";
                document.getElementById('cli-name').innerText = data.cliente;
                document.getElementById('task-desc').innerText = data.tarea;
                
                // --- LANZAR AVISOS ---
                reproducirPitido(660, 0.3); // Sonido 1
                setTimeout(() => reproducirPitido(880, 0.4), 300); // Sonido 2
                
                if (navigator.vibrate) navigator.vibrate([500, 110, 500]);
            } else {
                document.getElementById('no-task').style.display = "block";
                document.getElementById('task-card').style.display = "none";
            }
        });

        function finalizar() {
            if(confirm("¿CONFIRMAS FINALIZACIÓN?")) {
                db.ref('trabajadores/pedro/servicio_actual').update({ estado: "libre" });
            }
        }
    </script>
</body>
</html>
