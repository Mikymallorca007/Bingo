<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTISERVICIOS - EMPLEADO</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; background: #121212; color: white; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }

        /* Cabecera con nombre */
        header {
            background: #1e1e1e; padding: 20px; text-align: center;
            border-bottom: 2px solid #00d4ff; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        header h1 { margin: 0; font-size: 1.2rem; color: #00d4ff; letter-spacing: 2px; }
        #reloj { font-size: 0.8rem; color: #888; margin-top: 5px; }

        /* Contenido Principal */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

        /* Estado Libre */
        .status-free { text-align: center; color: #444; }
        .status-free .icon { font-size: 5rem; margin-bottom: 10px; opacity: 0.3; }
        .status-free p { font-weight: bold; letter-spacing: 1px; }

        /* Tarjeta de Tarea ACTIVA */
        #task-card { 
            display: none; width: 100%; max-width: 400px; 
            background: #f1c40f; color: #121212; 
            padding: 30px; border-radius: 30px; text-align: center;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h2 { margin: 0 0 15px 0; font-size: 2rem; font-weight: 900; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 10px; }
        .detail { margin: 20px 0; text-align: left; }
        .detail label { font-size: 0.7rem; font-weight: 900; color: rgba(0,0,0,0.5); display: block; }
        .detail span { font-size: 1.3rem; font-weight: 700; display: block; line-height: 1.2; }

        /* Botón de Finalizar */
        .btn-done { 
            width: 100%; padding: 20px; background: #121212; color: white; 
            border: none; border-radius: 20px; font-size: 1.2rem; font-weight: 900; 
            margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="user-display">TRABAJADOR: PEDRO</h1>
        <div id="reloj">00:00:00</div>
    </header>

    <main>
        <div id="no-task" class="status-free">
            <div class="icon">🛰️</div>
            <p>SISTEMA CONECTADO</p>
            <p style="font-size: 0.7rem; color: #00d4ff;">ESPERANDO NUEVAS ÓRDENES...</p>
        </div>

        <div id="task-card">
            <h2>NUEVA ORDEN</h2>
            
            <div class="detail">
                <label>CLIENTE</label>
                <span id="cli-name">CARGANDO...</span>
            </div>

            <div class="detail">
                <label>TRABAJO A REALIZAR</label>
                <span id="task-desc">CARGANDO...</span>
            </div>

            <button class="btn-done" onclick="finalizar()">TRABAJO TERMINADO</button>
        </div>
    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://tokentest-87f09-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // RELOJ EN TIEMPO REAL
        setInterval(() => {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString();
        }, 1000);

        // ESCUCHAR TAREAS DE PEDRO
        db.ref('trabajadores/pedro/servicio_actual').on('value', (snap) => {
            const data = snap.val();
            const card = document.getElementById('task-card');
            const empty = document.getElementById('no-task');

            if (data && data.estado === "pendiente") {
                empty.style.display = "none";
                card.style.display = "block";
                document.getElementById('cli-name').innerText = data.cliente;
                document.getElementById('task-desc').innerText = data.tarea;
                
                // AVISO VISUAL Y VIBRACIÓN
                if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            } else {
                empty.style.display = "block";
                card.style.display = "none";
            }
        });

        function finalizar() {
            if(confirm("¿CONFIRMAS QUE HAS TERMINADO?")) {
                db.ref('trabajadores/pedro/servicio_actual').update({ 
                    estado: "finalizado",
                    fin_timestamp: Date.now()
                });
            }
        }
    </script>
</body>
</html>
