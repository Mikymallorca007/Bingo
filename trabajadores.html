<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTISERVICIOS - PEDRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #1e1e1e; padding: 15px; text-align: center; border-bottom: 2px solid #00d4ff; }
        header h1 { margin: 0; font-size: 1rem; color: #00d4ff; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        #btn-start { padding: 25px 50px; background: #00d4ff; border: none; border-radius: 50px; font-weight: 900; font-size: 1.5rem; cursor: pointer; color: #121212; box-shadow: 0 0 20px #00d4ff; }
        .status-free { text-align: center; opacity: 0.4; }
        .status-free h1 { font-size: 4rem; margin: 0; }
        #task-card { display: none; width: 100%; max-width: 450px; background: #f1c40f; color: #121212; padding: 35px; border-radius: 35px; text-align: center; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px #f1c40f; } 50% { box-shadow: 0 0 40px #f1c40f; } 100% { box-shadow: 0 0 0px #f1c40f; } }
        .detail { margin: 25px 0; text-align: left; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 15px; }
        .detail label { font-size: 0.8rem; font-weight: 900; opacity: 0.7; }
        .detail span { font-size: 1.6rem; font-weight: 800; display: block; margin-top: 5px; }
        .btn-done { width: 100%; padding: 25px; background: #121212; color: white; border: none; border-radius: 20px; font-size: 1.3rem; font-weight: 900; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay">
        <h2 style="color:#00d4ff">SISTEMA DE EMERGENCIAS</h2>
        <p style="margin-bottom: 30px;">PULSA PARA ACTIVAR SONIDOS Y ALERTAS PUSH</p>
        <button id="btn-start" onclick="activarTodo()">ACTIVAR AHORA</button>
    </div>
    <header><h1>OPERARIO: PEDRO</h1></header>
    <main>
        <div id="no-task" class="status-free"><h1>🛰️</h1><p>ESPERANDO NUEVAS ÓRDENES...</p></div>
        <div id="task-card">
            <h2 style="margin:0; font-size: 2rem;">⚠️ NUEVO AVISO</h2>
            <div class="detail"><label>CLIENTE / UBICACIÓN</label><span id="cli-name"></span></div>
            <div class="detail"><label>TRABAJO A REALIZAR</label><span id="task-desc"></span></div>
            <button class="btn-done" onclick="finalizar()">MARCAR COMO TERMINADO</button>
        </div>
    </main>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDhO3xeBoLKe3ZEEOUl-T-vpPZXT2yI9X8",
            authDomain: "tokentest-87f09.firebaseapp.com",
            databaseURL: "https://tokentest-87f09-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tokentest-87f09",
            storageBucket: "tokentest-87f09.firebasestorage.app",
            messagingSenderId: "973211096919",
            appId: "1:973211096919:web:0140870d7fe8d86539d012"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messaging = firebase.messaging();
        let audioCtx;

        function activarTodo() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('firebase-messaging-sw.js')
                .then((registration) => {
                    messaging.useServiceWorker(registration);
                    return Notification.requestPermission();
                })
                .then((permission) => {
                    if (permission === 'granted') {
                        // CLAVE INSERTADA AQUÍ:
                        return messaging.getToken({ vapidKey: 'BGeQVz48jqOYPJSJLZcs9c6f0iQhhlwyUw-Je7sayrd9TGaeppIE7BR6qa639euoUJ64DrLe3JVPv_lp1w946Lk' });
                    } else {
                        throw new Error("Permiso denegado");
                    }
                })
                .then((token) => {
                    if (token) {
                        db.ref('trabajadores/pedro/token').set(token);
                        console.log("Token guardado con éxito");
                    }
                })
                .catch((err) => {
                    console.error("Fallo en activación:", err);
                    alert("Asegúrate de estar usando HTTPS para recibir avisos.");
                });
            }

            document.getElementById('overlay').style.display = 'none';
            reproducirPitido(440, 0.1); 
        }

        function reproducirPitido(frecuencia, duracion) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = frecuencia;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + duracion);
        }

        db.ref('trabajadores/pedro/servicio_actual').on('value', (snap) => {
            const data = snap.val();
            if (data && data.estado === "pendiente") {
                document.getElementById('no-task').style.display = "none";
                document.getElementById('task-card').style.display = "block";
                document.getElementById('cli-name').innerText = data.cliente;
                document.getElementById('task-desc').innerText = data.tarea;
                
                reproducirPitido(660, 0.3);
                setTimeout(() => reproducirPitido(880, 0.4), 400);
                if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
            } else {
                document.getElementById('no-task').style.display = "block";
                document.getElementById('task-card').style.display = "none";
            }
        });

        function finalizar() {
            if(confirm("¿CONFIRMAS QUE HAS TERMINADO EL TRABAJO?")) {
                db.ref('trabajadores/pedro/servicio_actual').update({ estado: "libre" });
            }
        }
    </script>
</body>
</html>
