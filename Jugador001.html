<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugador Bingo</title>
    <style>
        /* Estilos para el cartón */
    </style>
</head>
<body>
    <h1>Cartón de Bingo</h1>
    <div id="carton"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Recibir el cartón asignado
        socket.on('nuevoCarton', (carton) => {
            mostrarCarton(carton);
        });

        // Función para mostrar el cartón
        function mostrarCarton(carton) {
            const divCarton = document.getElementById('carton');
            divCarton.innerHTML = ''; // Limpiar el div

            carton.forEach(fila => {
                const filaDiv = document.createElement('div');
                fila.forEach(num => {
                    const casilla = document.createElement('div');
                    casilla.textContent = num;
                    casilla.classList.add('casilla');
                    filaDiv.appendChild(casilla);
                });
                divCarton.appendChild(filaDiv);
            });
        }
    </script>
</body>
</html>
