<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cartón de Bingo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            width: 400px;
            margin: 10px auto;
            background: #eee;
            border-radius: 10px;
            border: 2px solid black;
            padding: 10px;
        }
        .cell {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid black;
        }
        .bombo {
            background: url('bombo.png') center/contain no-repeat;
        }
    </style>
</head>
<body>
    <h1>Tu Cartón de Bingo</h1>
    <div id="bingoCardContainer"></div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const cardData = urlParams.get('card').split(',');

            if (cardData) {
                const cardContainer = document.getElementById('bingoCardContainer');
                let cardHtml = '<div class="bingo-card">';

                let cellIndex = 0;
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 8; col++) {
                        const cellData = cardData[cellIndex];
                        cardHtml += `<div class="cell">${cellData === "*" ? "*" : cellData}</div>`;
                        cellIndex++;
                    }
                }

                cardHtml += '</div>';
                cardContainer.innerHTML = cardHtml;
            } else {
                alert('No se ha encontrado un cartón válido en la URL.');
            }
        };
    </script>
</body>
</html>
