<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cartón de Bingo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .container { width: 80%; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); }
        h1 { color: #ff6600; }
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            width: 400px;
            margin: 10px auto;
            background: #eee;
            border-radius: 10px;
            border: 2px solid black;
            padding: 10px;
        }
        .cell {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid black;
        }
        .bombo {
            background: url('bombo.png') center/contain no-repeat;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tu Cartón de Bingo</h1>
        <div id="card-container"></div>
    </div>

    <script>
        window.onload = function() {
            // Recupera el cartón desde sessionStorage
            const bingoCardData = JSON.parse(sessionStorage.getItem('cartonJugador1'));
            if (bingoCardData) {
                const cardHtml = generateCardFromData(bingoCardData);
                document.getElementById('card-container').innerHTML = cardHtml;
            } else {
                document.getElementById('card-container').innerHTML = 'No se ha encontrado tu cartón. Vuelve a generarlo.';
            }
        };

        function generateCardFromData(cardData) {
            let cardHtml = '<div class="bingo-card">';
            let cellIndex = 0;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 8; col++) {
                    if (cardData[cellIndex] === '*') {
                        cardHtml += `<div class="cell bombo">*</div>`;
                    } else {
                        cardHtml += `<div class="cell">${cardData[cellIndex]}</div>`;
                    }
                    cellIndex++;
                }
            }
            cardHtml += '</div>';
            return cardHtml;
        }
    </script>
</body>
</html>
