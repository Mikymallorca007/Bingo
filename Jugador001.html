<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartón de Bingo - Jugador 001</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            width: 400px;
            margin: 10px auto;
            background: #eee;
            border-radius: 10px;
            border: 2px solid black;
            padding: 10px;
        }
        .cell {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Cartón de Bingo - Jugador 001</h1>
    <div id="bingoCardContainer"></div>

    <script>
        window.onload = function() {
            // Recuperar cartón de localStorage
            let bingoCardData = localStorage.getItem('cartonJugador1');
            
            if (bingoCardData) {
                bingoCardData = JSON.parse(bingoCardData);
                displayBingoCard(bingoCardData);
            } else {
                alert('No se ha encontrado el cartón en localStorage.');
            }
        };

        function displayBingoCard(data) {
            const container = document.getElementById('bingoCardContainer');
            let cardHtml = '<div class="bingo-card">';
            
            // Mostrar el cartón con los números recuperados
            for (let i = 0; i < 24; i++) {
                let value = data[i] === '*' ? '*' : data[i];
                cardHtml += `<div class="cell">${value}</div>`;
            }
            
            cardHtml += '</div>';
            container.innerHTML = cardHtml;
        }
    </script>
</body>
</html>
