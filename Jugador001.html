<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Jugador</title>

    <!-- Agregar Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js"></script>

    <script>
      // Configuración de Firebase (reemplaza con tus datos)
      const firebaseConfig = {
        apiKey: "AIzaSyBYxGZ0h0pYmHD3y0Je65n3W3Cks5nq1zoqej9g",
        authDomain: "bingoonline-bd06b.firebaseapp.com",
        projectId: "bingoonline-bd06b",
        storageBucket: "bingoonline-bd06b.appspot.com",
        messagingSenderId: "270863273268",
        appId: "1:270863273268:web:a6b2ca08792864359bba5b"
      };

      // Inicializar Firebase
      const app = firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore(app);

      // Mostrar el cartón del jugador
      function mostrarCartonJugador(carton) {
        const divCarton = document.getElementById('cartonJugador');
        divCarton.innerHTML = '';  // Limpiar el div antes de mostrar el cartón

        carton.forEach(fila => {
          const filaDiv = document.createElement('div');
          fila.forEach(num => {
            const casilla = document.createElement('div');
            casilla.textContent = num;
            casilla.classList.add('casilla');
            filaDiv.appendChild(casilla);
          });
          divCarton.appendChild(filaDiv);
        });
      }

      // Escuchar cambios en Firestore para obtener el cartón en tiempo real
      db.collection("cartones").orderBy("timestamp", "desc").limit(1).onSnapshot((snapshot) => {
        snapshot.forEach((doc) => {
          const carton = doc.data().carton;
          mostrarCartonJugador(carton);
        });
      });
    </script>
</head>
<body>
    <h1>Bingo Jugador</h1>

    <div id="cartonJugador">
        <!-- El cartón asignado al jugador se mostrará aquí -->
    </div>

</body>
</html>
