<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartón de Bingo</title>
    <style>
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            width: 400px;
            margin: 10px auto;
            background: #eee;
            border-radius: 10px;
            border: 2px solid black;
            padding: 10px;
        }
        .cell {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid black;
        }
        .bombo {
            background: url('bombo.png') center/contain no-repeat;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tu Cartón de Bingo</h1>
        <div id="bingoCardContainer"></div>
    </div>

    <script>
        window.onload = function() {
            const playerId = '1';  // Usar el ID adecuado para cada jugador.
            const cardData = sessionStorage.getItem(`cartonJugador${playerId}`);
            
            if (cardData) {
                const bingoCard = JSON.parse(cardData);
                displayBingoCard(bingoCard);
            } else {
                alert('No se ha encontrado el cartón. Vuelve a generarlo.');
            }
        }

        function displayBingoCard(bingoCard) {
            const cardContainer = document.getElementById('bingoCardContainer');
            let cardHtml = '<div class="bingo-card">';
            
            let index = 0;
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 8; col++) {
                    if (bingoCard[index] === '*') {
                        cardHtml += `<div class="cell bombo">*</div>`;
                    } else {
                        cardHtml += `<div class="cell">${bingoCard[index]}</div>`;
                    }
                    index++;
                }
            }
            cardHtml += '</div>';
            cardContainer.innerHTML = cardHtml;
        }
    </script>
</body>
</html>
