<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cartón de Bingo</title>
    <script type="module">
        // Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAUBhl6WReg9I4Xlt9ie8GXGMvY_z0Wer4",
            authDomain: "cartones-bingo-online.firebaseapp.com",
            projectId: "cartones-bingo-online",
            storageBucket: "cartones-bingo-online.appspot.com",
            messagingSenderId: "76376812918",
            appId: "1:76376812918:web:00f9747409931301589e57"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function cargarCarton() {
            const jugadorId = "Jugador001"; // Cambiar por el ID dinámico si es necesario
            const cartonRef = ref(db, 'cartones/' + jugadorId);

            get(cartonRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const datos = snapshot.val();
                    mostrarCarton(datos.carton);
                } else {
                    document.getElementById("carton").innerHTML = "No se ha encontrado tu cartón. Vuelve a generarlo.";
                }
            });
        }

        function mostrarCarton(carton) {
            let html = "<table border='1'>";
            for (let i = 0; i < carton.length; i++) {
                if (i % 8 === 0) html += "<tr>";
                html += `<td>${carton[i]}</td>`;
                if (i % 8 === 7) html += "</tr>";
            }
            html += "</table>";
            document.getElementById("carton").innerHTML = html;
        }

        window.onload = cargarCarton;
    </script>
</head>
<body>
    <h1>Tu Cartón de Bingo</h1>
    <div id="carton">Cargando...</div>
</body>
</html>
