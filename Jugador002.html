<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cartón de Bingo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .bingo-card { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            gap: 2px; 
            width: 340px; 
            margin: 10px auto; 
            background: #eee; 
            border-radius: 10px; 
            border: 2px solid black; 
            padding: 10px;
        }
        .cell { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: white; 
            border-radius: 5px; 
            font-size: 18px; 
            font-weight: bold;
            border: 1px solid black;
        }
        .bombo { 
            background: url('bombo.png') center/contain no-repeat;
        }
    </style>
</head>
<body>
    <h1>Tu Cartón de Bingo</h1>
    <div class="bingo-card" id="playerCard">
        <!-- El cartón del jugador se generará aquí -->
    </div>

    <script>
        window.onload = function() {
            // Recuperar el cartón del jugador desde localStorage
            const playerId = window.location.pathname.split('/').pop().replace('Jugador', '').replace('.html', '');
            const cartonData = JSON.parse(localStorage.getItem(`cartonJugador${playerId}`));

            if (cartonData) {
                const cardContainer = document.getElementById('playerCard');
                let index = 0;
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 8; col++) {
                        let cell = document.createElement('div');
                        cell.classList.add('cell');
                        let cellContent = cartonData[index];
                        if (cellContent === '') {
                            cell.classList.add('bombo');
                        } else {
                            cell.textContent = cellContent;
                        }
                        cardContainer.appendChild(cell);
                        index++;
                    }
                }
            } else {
                alert('No se ha encontrado tu cartón. Intenta acceder desde el enlace correcto.');
            }
        }
    </script>
</body>
</html>
