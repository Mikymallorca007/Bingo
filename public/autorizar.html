<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Autorizaciones</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 20px; }
        .jugador-card { 
            background: #1e1e1e; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-left: 5px solid #444;
        }
        .pendiente { border-left-color: #ffc107; background: #2b2615; }
        .autorizado { border-left-color: #28a745; opacity: 0.8; }
        
        .info { flex-grow: 1; }
        .nombre { font-size: 1.2rem; font-weight: bold; display: block; }
        .estado-texto { font-size: 0.8rem; text-transform: uppercase; color: #aaa; }
        
        .acciones { display: flex; gap: 10px; }
        button { padding: 8px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-auth { background: #28a745; color: white; }
        .btn-kick { background: #dc3545; color: white; }
        /* NUEVO: Estilo para el botón de baneo */
        .btn-ban { background: #000; color: #ff4444; border: 1px solid #ff4444; }
        
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .contador { background: #007bff; padding: 2px 10px; border-radius: 20px; font-size: 1rem; }
    </style>
</head>
<body>
    <h2>
        Peticiones de Entrada
        <span class="contador" id="total">0</span>
    </h2>
    <div id="lista-peticiones"></div>

    <script>
        const socket = io();

        socket.on('LISTA_ESPERA_ACTUALIZADA', (jugadores) => {
            const contenedor = document.getElementById('lista-peticiones');
            document.getElementById('total').innerText = jugadores.length;
            contenedor.innerHTML = '';

            // MODIFICACIÓN: Ordenamos para que 'pendiente' aparezca siempre arriba
            const jugadoresOrdenados = [...jugadores].sort((a, b) => {
                if (a.estado === 'pendiente' && b.estado !== 'pendiente') return -1;
                if (a.estado !== 'pendiente' && b.estado === 'pendiente') return 1;
                return 0;
            });

            jugadoresOrdenados.forEach(j => {
                const div = document.createElement('div');
                div.className = `jugador-card ${j.estado}`;
                
                div.innerHTML = `
                    <div class="info">
                        <span class="nombre">${j.nombre}</span>
                        <span class="estado-texto">${j.estado === 'pendiente' ? '⏳ Esperando aprobación' : '✅ Autorizado'}</span>
                    </div>
                    <div class="acciones">
                        ${j.estado === 'pendiente' 
                            ? `<button class="btn-auth" onclick="autorizar('${j.id}')">ACEPTAR</button>` 
                            : ''
                        }
                        <button class="btn-kick" onclick="expulsar('${j.id}')">${j.estado === 'pendiente' ? 'RECHAZAR' : 'EXPULSAR'}</button>
                        <button class="btn-ban" onclick="banear('${j.id}')">BAN IP</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        });

        function autorizar(id) { socket.emit('MASTER_AUTORIZAR', id); }
        function expulsar(id) { if(confirm('¿Expulsar a este jugador?')) socket.emit('MASTER_EXPULSAR', id); }
        /* NUEVA LÓGICA: BANEO PERMANENTE POR IP */
        function banear(id) { 
            if(confirm('¿BLOQUEAR IP PERMANENTEMENTE? No podrá volver a entrar con este dispositivo.')) {
                socket.emit('MASTER_BANEAR', id); 
            }
        }
    </script>
</body>
</html>
