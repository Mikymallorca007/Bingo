<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JUGADOR - Bingo Aldea Bella</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --bg: #0f0c29; --accent: #00d2ff; --win: #2ecc71; --fail: #e74c3c; }
        * { box-sizing: border-box; touch-action: manipulation; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: #0f0c29; 
            color: white; margin: 0; padding: 5px; height: 100vh; width: 100vw; display: flex; overflow: hidden; 
        }

        /* CAPA DE BLOQUEO TOTAL */
        #bloqueo-pantalla { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #0f0c29; z-index: 50000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }

        #icon-espera { font-size: 8rem; margin-bottom: 20px; transition: all 0.3s; }
        #texto-espera { font-size: 1.8rem; margin-bottom: 20px; transition: all 0.3s; }
        
        /* CONTADOR GIGANTE */
        #contador-gigante {
            font-size: 15rem; font-weight: 900; color: #fff;
            text-shadow: 0 0 40px var(--accent);
            -webkit-text-stroke: 3px var(--accent);
            display: none; 
            line-height: 1;
        }

        /* REGISTRO */
        #pantalla-registro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0c29; z-index: 60000; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
        }

        aside { width: 80px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-right: 8px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; }
        main { flex-grow: 1; height: 100%; }
        .grid-bingo { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); gap: 5px; width: 100%; height: 100%; }
        .cell { background: white; color: #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; border-radius: 8px; }
        .cell.empty { background: rgba(255,255,255,0.05); }
        .cell.marked-ok { background: var(--win) !important; color: white; }
        
        .input-nombre { background: rgba(255,255,255,0.1); border: 2px solid var(--accent); border-radius: 15px; padding: 15px; color: white; font-size: 1.5rem; text-align: center; margin-bottom: 20px; outline: none; }
        .btn-entrar { background: var(--win); color: white; border: none; padding: 15px 40px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; }
        .bola-cantada { background: white; color: #1e272e; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; border: 4px solid var(--win); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="pantalla-registro">
        <h1 style="color:var(--accent);">BINGO ALDEA BELLA</h1>
        <input type="text" id="input-nombre" class="input-nombre" placeholder="TU NOMBRE..." maxlength="12">
        <button class="btn-entrar" onclick="procesarEntrada()">ENTRAR</button>
    </div>

    <div id="bloqueo-pantalla" style="display:none;">
        <div id="icon-espera">🚫</div>
        <div id="texto-espera">ESPERANDO ACEPTACIÓN...</div>
        <div id="contador-gigante">--</div>
    </div>

    <aside>
        <div id="bola-viva" class="bola-cantada">--</div>
        <div id="h-1" style="opacity:0.5;">--</div>
    </aside>

    <main><div class="grid-bingo" id="bingo-grid"></div></main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCg8YWdMDcv5n1n84ywQr7-9O8ze6KiRJo", databaseURL: "https://bingoaldeabella-default-rtdb.europe-west1.firebasedatabase.app", projectId: "bingoaldeabella" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let miId = localStorage.getItem('aldea_uid') || 'u' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('aldea_uid', miId);
        let miNombre = localStorage.getItem('aldea_nombre');
        let autorizado = false;
        let segundosGlobal = 0;
        let miMatriz = [];

        window.onload = () => { if(miNombre) { document.getElementById('pantalla-registro').style.display='none'; conectar(); } };

        function procesarEntrada() {
            miNombre = document.getElementById('input-nombre').value.trim().toUpperCase();
            if(miNombre.length < 2) return;
            localStorage.setItem('aldea_nombre', miNombre);
            document.getElementById('pantalla-registro').style.display='none';
            conectar();
        }

        function refrescarPantalla() {
                    const capa = document.getElementById('bloqueo-pantalla');
                    const icon = document.getElementById('icon-espera');
                    const txt = document.getElementById('texto-espera');
                    const cont = document.getElementById('contador-gigante');
        
                    // 1. Si hay cuenta atrás activa (5, 4, 3, 2, 1...)
                    if (segundosGlobal > 0) {
                        capa.style.display = 'flex';
                        cont.style.display = 'block';
                        cont.innerText = segundosGlobal;
                        icon.style.display = 'none'; // Ocultamos el icono para que no estorbe al número
                        txt.style.display = 'none';
                        return;
                    }
        
                    // 2. Si la cuenta atrás es 0 (Aún no ha empezado O ya terminó)
                    cont.style.display = 'none';
        
                    if (autorizado) {
                        // ESTA ES LA CLAVE: 
                        // Solo ocultamos la pantalla si la última bola ya no es "--" 
                        // o si el Master ha dado la orden de inicio.
                        const bolaActual = document.getElementById('bola-viva').innerText;
                        
                        if (bolaActual !== "--") {
                            // La partida ya está en marcha
                            capa.style.display = 'none';
                        } else {
                            // Estamos aceptados pero el Master aún no ha lanzado la cuenta atrás
                            capa.style.display = 'flex';
                            icon.style.display = 'block';
                            icon.innerText = "✅";
                            txt.style.display = 'block';
                            txt.innerText = "¡ACEPTADO! ESPERA AL MASTER...";
                        }
                    } else {
                        // No autorizado aún
                        capa.style.display = 'flex';
                        icon.style.display = 'block';
                        icon.innerText = "🚫";
                        txt.style.display = 'block';
                        txt.innerText = "ESPERANDO ACEPTACIÓN...";
                    }
                }


        
        function conectar() {
            document.getElementById('bloqueo-pantalla').style.display = 'flex';

            // Escuchar Solicitudes
            db.ref('bingo/solicitudes/' + miId).on('value', snap => {
                const s = snap.val();
                if(!s) {
                    db.ref('bingo/solicitudes/' + miId).set({ nombre: miNombre, estado: "pendiente" });
                } else {
                    if(s.estado === "autorizado") {
                        autorizado = true;
                        document.getElementById('icon-espera').innerText = "✅";
                        document.getElementById('texto-espera').innerText = "¡ACEPTADO! ESPERA AL MASTER...";
                        if(miMatriz.length === 0) generarCartonLocal();
                    } else {
                        autorizado = false;
                    }
                    refrescarPantalla();
                }
            });

            // Escuchar Cuenta Atrás
            db.ref('bingo/cuentaAtras').on('value', snap => {
                segundosGlobal = parseInt(snap.val()) || 0;
                refrescarPantalla();
            });

            escucharBolas();
        }

        function generarCartonLocal() {
            let matriz = Array.from({length: 4}, () => Array(8).fill(true));
            for (let f = 0; f < 4; f++) {
                let h = 0;
                while (h < 3) {
                    let c = Math.floor(Math.random() * 8);
                    if (matriz[f][c] === true) { matriz[f][c] = null; h++; }
                }
            }
            for (let c = 0; c < 8; c++) {
                let nums = []; for(let i=1; i<=10; i++) nums.push((c*10)+i);
                nums.sort(() => Math.random() - 0.5);
                let vals = [];
                for (let f = 0; f < 4; f++) if(matriz[f][c]) vals.push(nums.pop());
                vals.sort((a,b) => a-b);
                let idx = 0;
                for (let f = 0; f < 4; f++) if(matriz[f][c]) matriz[f][c] = vals[idx++];
            }
            miMatriz = matriz;
            dibujar();
        }

        function dibujar() {
            const g = document.getElementById('bingo-grid'); g.innerHTML = "";
            miMatriz.forEach((fila, fi) => {
                fila.forEach((num, ci) => {
                    const d = document.createElement('div');
                    d.className = num ? 'cell' : 'cell empty';
                    d.innerText = num || "";
                    if(num) d.onclick = () => {
                        d.classList.toggle('marked-ok');
                        if(navigator.vibrate) navigator.vibrate(40);
                    };
                    g.appendChild(d);
                });
            });
        }

        function escucharBolas() {
            db.ref('bingo/ultimaBola').on('value', snap => {
                if(snap.val()) document.getElementById('bola-viva').innerText = snap.val();
            });
            db.ref('bingo/idPartida').on('value', snap => {
                if(snap.val() && snap.val() != localStorage.getItem('id_p')) {
                    localStorage.setItem('id_p', snap.val());
                    window.location.reload(true);
                }
            });
        }
    </script>
</body>
</html>
