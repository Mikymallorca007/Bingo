<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>BINGO ALDEA BELLA</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; background-color: #1e272e; color: white; margin: 0; padding: 5px;
            height: 100vh; width: 100vw; display: flex; flex-direction: row; overflow: hidden; 
            -webkit-user-select: none; user-select: none; touch-action: manipulation;
        }
        aside {
            width: 22vw; min-width: 110px; display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center; background: #2f3542;
            border-radius: 12px; margin-right: 10px; padding: 15px 5px; flex-shrink: 0; border: 2px solid #485460;
        }
        .current-ball {
            background: #ffffff; color: #1e272e; width: 90px; height: 90px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 3rem;
            font-weight: 900; border: 4px solid #2ecc71; margin-bottom: 10px;
        }
        .prev-ball {
            background: #485460; color: #d2dae2; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-top: 5px;
        }
        main { flex-grow: 1; height: 100%; display: flex; }
        .grid { 
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); 
            gap: 4px; background: #808e9b; padding: 5px; border-radius: 4px; width: 100%; height: 100%;
        }
        .cell { 
            background: white; color: #2f3542; display: flex; align-items: center; justify-content: center; 
            font-size: 2rem; font-weight: bold; border-radius: 4px;
        }
        .cell.empty { background: #a4b0be; }
        .cell.marked { background: #2ecc71 !important; color: white; }
        #msg-status { position: fixed; top: 10px; right: 10px; background: #f1c40f; color: black; padding: 5px 10px; border-radius: 5px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div id="msg-status">ESPERANDO VERIFICACIÓN...</div>

    <aside>
        <div style="font-size: 0.8rem; color: #2ecc71;">BOLA</div>
        <div id="ball-display" class="current-ball">--</div>
        <div id="prev-1" class="prev-ball">--</div>
        <div id="prev-2" class="prev-ball">--</div>
    </aside>

    <main>
        <div class="grid" id="bingo-grid"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCg8YWdMDcv5n1n84ywQr7-9O8ze6KiRJo",
            databaseURL: "https://bingoaldeabella-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bingoaldeabella",
            appId: "1:911712071246:web:52e2f5edb30e0372471d1f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let bolasCantadas = new Set();
        let lineaPremiada = false;
        let miMatriz = [];

        // 1. Escuchar bolas y estado de la línea
        db.ref('bingo/ultimaBola').on('value', (snap) => {
            const num = snap.val();
            if (num) {
                bolasCantadas.add(num);
                document.getElementById('prev-1').innerText = document.getElementById('ball-display').innerText;
                document.getElementById('ball-display').innerText = num;
            }
        });

        db.ref('bingo/lineaCantada').on('value', (snap) => {
            lineaPremiada = snap.val();
        });

        // 2. Generar Cartón Persistente
        function generarCarton() {
            let guardado = localStorage.getItem('carton_aldea');
            miMatriz = guardado ? JSON.parse(guardado) : crearMatriz();
            localStorage.setItem('carton_aldea', JSON.stringify(miMatriz));
            dibujar();
        }

        function crearMatriz() {
            let m = Array.from({length:4}, () => Array(8).fill(null));
            for(let f=0; f<4; f++) {
                let nums = Array.from({length:20}, (_,i) => i+(f*20)+1).sort(()=>Math.random()-0.5).slice(0,5).sort((a,b)=>a-b);
                let cols = [0,1,2,3,4,5,6,7].sort(()=>Math.random()-0.5).slice(0,5).sort();
                cols.forEach((c,i) => m[f][c] = nums[i]);
            }
            return m;
        }

        function dibujar() {
            const grid = document.getElementById('bingo-grid');
            miMatriz.forEach((fila, fIdx) => {
                fila.forEach((num, cIdx) => {
                    const div = document.createElement('div');
                    div.className = num ? 'cell' : 'cell empty';
                    div.innerText = num || '';
                    if(num) {
                        let t;
                        div.onclick = () => {
                            div.classList.toggle('marked');
                            comprobarLinea(fIdx);
                        };
                    }
                    grid.appendChild(div);
                });
            });
        }

        function comprobarLinea(filaIdx) {
            if (lineaPremiada) return; // Ya hubo premio de línea

            const celdasFila = document.querySelectorAll(`.grid > div:nth-child(n+${filaIdx*8+1}):nth-child(-n+${(filaIdx+1)*8})`);
            let marcadosYValidos = 0;
            let totalNumerosEnFila = 0;

            celdasFila.forEach(celda => {
                if(celda.innerText !== "") {
                    totalNumerosEnFila++;
                    const num = parseInt(celda.innerText);
                    if(celda.classList.contains('marked') && bolasCantadas.has(num)) {
                        marcadosYValidos++;
                    }
                }
            });

            // Si ha marcado todos los de la fila Y todos han salido
            if(marcadosYValidos === totalNumerosEnFila && totalNumerosEnFila > 0) {
                document.getElementById('msg-status').style.display = 'block';
                db.ref('bingo/estado').set('PAUSA_LINEA');
                db.ref('bingo/aviso').set("¡LÍNEA RECLAMADA!");
            }
        }

        window.onload = generarCarton;
    </script>
</body>
</html>
