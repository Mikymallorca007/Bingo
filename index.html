<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Master - Bingo 80 bolas</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .container { width: 80%; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); }
        h1 { color: #ff6600; }
        .player-list { margin-top: 20px; }
        .player { background: #f8f8f8; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; }
        .input-group { margin: 10px 0; }
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            width: 400px;
            margin: 10px auto;
            background: #eee;
            border-radius: 10px;
            border: 2px solid black;
            padding: 10px;
        }
        .cell {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid black;
        }
        .bombo {
            background: url('bombo.png') center/contain no-repeat;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel del Master - Bingo 80 bolas</h1>
        <div>
            <label for="numPlayers">Número de jugadores:</label>
            <input type="number" id="numPlayers" min="1" max="100" value="1">
            <button onclick="createPlayers()">Configurar Jugadores</button>
        </div>
        <div class="player-list" id="playerList"></div>
    </div>

    <script>
        function createPlayers() {
            const numPlayers = document.getElementById('numPlayers').value;
            const playerList = document.getElementById('playerList');
            playerList.innerHTML = '';

            for (let i = 1; i <= numPlayers; i++) {
                const playerDiv = document.createElement('div');
                playerDiv.classList.add('player');
                playerDiv.innerHTML = `
                    <h3>Jugador ${i}</h3>
                    <div class="input-group">
                        <label for="playerName${i}">Nombre:</label>
                        <input type="text" id="playerName${i}" placeholder="Nombre del jugador ${i}">
                    </div>
                    <div class="input-group">
                        <label for="playerPhone${i}">Número de Teléfono:</label>
                        <input type="text" id="playerPhone${i}" placeholder="Número del jugador ${i}">
                    </div>
                    <button onclick="generateCard(${i})">Generar Cartón</button>
                    <div id="card-${i}" style="margin-top: 10px;"></div>
                    <div id="whatsappLink-${i}" style="margin-top: 10px;"></div>
                `;
                playerList.appendChild(playerDiv);
            }
        }

        function generateCard(playerId) {
            const playerName = document.getElementById(`playerName${playerId}`).value;
            const playerPhone = document.getElementById(`playerPhone${playerId}`).value;
            
            if (!playerName || !playerPhone) {
                alert('Por favor, ingresa el nombre y el número de teléfono del jugador');
                return;
            }

            const cardContainer = document.getElementById(`card-${playerId}`);
            const bingoCard = generateBingoCard();
            cardContainer.innerHTML = bingoCard.html;
            
            // Guardar cartón en localStorage
            localStorage.setItem(`cartonJugador${playerId}`, JSON.stringify(bingoCard.data));

            const message = `Hola ${playerName}, tu cartón de bingo es:\n${window.location.href}Jugador${String(playerId).padStart(3, '0')}.html`;
            const whatsappLink = `https://wa.me/${playerPhone}?text=${encodeURIComponent(message)}`;
            document.getElementById(`whatsappLink-${playerId}`).innerHTML = `<a href="${whatsappLink}" target="_blank">Enviar por WhatsApp</a>`;
        }

        function generateBingoCard() {
            let numbers = [];
            for (let col = 0; col < 8; col++) {
                let min = col * 10 + 1;
                let max = col === 7 ? 80 : (col + 1) * 10;
                let colNumbers = Array.from({ length: max - min + 1 }, (_, index) => min + index)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 5)
                    .sort((a, b) => a - b);
                numbers.push(colNumbers);
            }

            let bomboPositions = new Set();
            while (bomboPositions.size < 9) bomboPositions.add(Math.floor(Math.random() * 24));

            let cellIndex = 0;
            let cardHtml = '<div class="bingo-card">';
            let cardData = [];
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 8; col++) {
                    if (bomboPositions.has(cellIndex)) {
                        cardHtml += `<div class="cell bombo">*</div>`;
                        cardData.push('*');
                    } else {
                        let number = numbers[col].shift();
                        cardHtml += `<div class="cell">${number}</div>`;
                        cardData.push(number);
                    }
                    cellIndex++;
                }
            }
            cardHtml += '</div>';
            return { html: cardHtml, data: cardData };
        }
    </script>
</body>
</html>
