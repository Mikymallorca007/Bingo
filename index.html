<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        #btnInstalar { 
            display: none; padding: 20px; background: #2ecc71; color: white; 
            border: none; border-radius: 10px; font-size: 20px; cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Prueba de Instalación</h1>
    <p>Si el manifest y el sw son correctos, aparecerá el botón:</p>
    
    <button id="btnInstalar">HOLA, INSTÁLAME</button>

    <script>
        // 1. Registrar el Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("SW registrado"))
                .catch(err => console.log("Fallo SW", err));
        }

        // 2. Capturar el evento de instalación
        let eventoInstalacion;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            eventoInstalacion = e;
            // Si llegamos aquí, ¡el botón se mostrará!
            document.getElementById('btnInstalar').style.display = 'block';
        });

        document.getElementById('btnInstalar').addEventListener('click', async () => {
            if (eventoInstalacion) {
                eventoInstalacion.prompt();
                const { outcome } = await eventoInstalacion.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('btnInstalar').style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
