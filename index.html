<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTISERVICIOS - PANEL JEFE</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; background: #1e1e1e; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #00d4ff; text-align: center; letter-spacing: 2px; margin-bottom: 30px; }
        label { display: block; margin-top: 15px; color: #888; font-size: 0.75rem; font-weight: bold; }
        input, select { width: 100%; padding: 18px; margin-top: 8px; border-radius: 12px; border: 2px solid #333; background: #121212; color: white; font-size: 1rem; }
        input:focus { border-color: #00d4ff; outline: none; }
        button { width: 100%; padding: 20px; margin-top: 30px; border-radius: 15px; border: none; background: #00d4ff; color: #121212; font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); background: #00b8db; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PANEL DE CONTROL</h2>
        <label>SELECCIONAR OPERARIO:</label>
        <select id="worker"><option value="pedro">PEDRO</option></select>
        <label>CLIENTE / DIRECCIÓN:</label>
        <input type="text" id="cliente" placeholder="EJ: C/ MAYOR 15, 3B">
        <label>DESCRIPCIÓN DE LA TAREA:</label>
        <input type="text" id="tarea" placeholder="EJ: REPARAR CALDERA">
        <button onclick="enviarOrden()">ENVIAR AVISO URGENTE</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhO3xeBoLKe3ZEEOUl-T-vpPZXT2yI9X8",
            authDomain: "tokentest-87f09.firebaseapp.com",
            databaseURL: "https://tokentest-87f09-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tokentest-87f09",
            storageBucket: "tokentest-87f09.firebasestorage.app",
            messagingSenderId: "973211096919",
            appId: "1:973211096919:web:0140870d7fe8d86539d012"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // AQUÍ PEGA TU SERVER KEY (API HEREDADA) DE FIREBASE CONSOLE
        // Formato: AAAA... (Es una cadena muy larga)
        const SERVER_KEY = "TU_SERVER_KEY_AQUI";

        function enviarOrden() {
            const worker = document.getElementById('worker').value;
            const cli = document.getElementById('cliente').value;
            const tar = document.getElementById('tarea').value;

            if(!cli || !tar) return alert("¡ERROR! RELLENA TODOS LOS DATOS");

            // 1. Guardar en la base de datos para que aparezca en la pantalla de Pedro si está abierta
            db.ref('trabajadores/' + worker + '/servicio_actual').set({
                cliente: cli,
                tarea: tar,
                estado: "pendiente",
                timestamp: Date.now()
            }).then(() => {
                // 2. Disparar la notificación PUSH para móviles bloqueados/cerrados
                notificarPush(worker, cli, tar);
                alert("ORDEN ENVIADA CORRECTAMENTE");
                document.getElementById('cliente').value = "";
                document.getElementById('tarea').value = "";
            }).catch(e => {
                console.error(e);
                alert("ERROR DE CONEXIÓN AL ENVIAR");
            });
        }

        function notificarPush(worker, cli, tar) {
            // Buscamos el token que Pedro registró al pulsar "Activar Sistema"
            db.ref('trabajadores/' + worker + '/token').once('value').then((snap) => {
                const token = snap.val();
                if (!token) {
                    console.warn("El trabajador no tiene un token registrado. No recibirá notificación Push.");
                    return;
                }

                // Llamada a la API de Firebase Cloud Messaging
                fetch('https://fcm.googleapis.com/fcm/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'key=' + SERVER_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: token,
                        priority: "high",
                        notification: {
                            title: "⚠️ NUEVA TAREA: " + cli,
                            body: tar,
                            icon: "https://via.placeholder.com/192/00d4ff/ffffff?text=M",
                            click_action: window.location.origin + "/trabajadores.html",
                            sound: "default"
                        }
                    })
                })
                .then(response => response.json())
                .then(data => console.log("Resultado Push:", data))
                .catch(error => console.error("Error enviando Push:", error));
            });
        }
    </script>
</body>
</html>
