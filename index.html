<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BINGO ALDEA BELLA</title>
    <style>
        :root { --bg: #0f0c29; --accent: #00d2ff; --win: #2ecc71; --fail: #e74c3c; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(to right, #0f0c29, #302b63, #24243e); color: white; margin: 0; padding: 5px; height: 100vh; width: 100vw; display: flex; overflow: hidden; }
        
        aside { width: 22vw; background: rgba(255, 255, 255, 0.1); border-radius: 15px; margin-right: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(5px); }
        .bola-cantada { background: white; color: #1e272e; width: 75px; height: 75px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; font-weight: 900; border: 4px solid var(--win); margin-bottom: 10px; }
        .historial { background: rgba(0,0,0,0.3); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 5px; color: #aaa; }

        main { flex-grow: 1; height: 100%; }
        .grid-bingo { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); gap: 6px; width: 100%; height: 100%; }
        .cell { background: white; color: #2c3e50; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 800; border-radius: 8px; box-shadow: 0 4px 0 #bdc3c7; }
        .cell.empty { background: rgba(255,255,255,0.05); box-shadow: none; }
        .cell.marked-ok { background: var(--win) !important; color: white; box-shadow: 0 4px 0 #27ae60; transform: translateY(2px); }
        .cell.marked-error { background: var(--fail) !important; color: white; box-shadow: 0 4px 0 #c0392b; transform: translateY(2px); }

        #bloqueo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e3c72; z-index: 9999; display: flex; align-items: center; justify-content: center; text-align: center; }
        .status-box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div id="bloqueo">
        <div class="status-box">
            <h1 id="bloqueo-status" style="font-size: 2.5rem; margin:0;">CONECTANDO...</h1>
        </div>
    </div>

    <aside>
        <div id="bola-viva" class="bola-cantada">--</div>
        <div id="h-1" class="historial">--</div>
        <div id="h-2" class="historial">--</div>
    </aside>

    <main><div class="grid-bingo" id="bingo-grid"></div></main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCg8YWdMDcv5n1n84ywQr7-9O8ze6KiRJo", databaseURL: "https://bingoaldeabella-default-rtdb.europe-west1.firebasedatabase.app", projectId: "bingoaldeabella" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let miId = localStorage.getItem('aldea_uid') || 'u' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('aldea_uid', miId);
        let miNombre = localStorage.getItem('aldea_nombre');
        let bolasEnJuego = new Set();
        let yaHuboLinea = false;
        let miMatriz = [];

        db.ref('bingo/solicitudes/' + miId).on('value', snap => {
            const s = snap.val();
            if(!s) {
                if(!miNombre) { miNombre = prompt("Dime tu nombre:").toUpperCase(); localStorage.setItem('aldea_nombre', miNombre); }
                db.ref('bingo/solicitudes/' + miId).set({ nombre: miNombre, estado: "pendiente" });
            } else if(s.estado === "pendiente") {
                document.getElementById('bloqueo').style.display = 'flex';
                document.getElementById('bloqueo-status').innerHTML = "¡HOLA " + s.nombre + "!<br>Espera al Master.";
            } else {
                document.getElementById('bloqueo').style.display = 'none';
                if(miMatriz.length === 0) cargarJuego();
            }
        });

        db.ref('bingo/estado').on('value', snap => {
            const est = snap.val();
            const status = document.getElementById('bloqueo-status');
            if(est && est.startsWith("CUENTA_")) {
                const seg = est.split("_")[1];
                document.getElementById('bloqueo').style.display = 'flex';
                status.innerHTML = `<span style="font-size:5rem; color:yellow;">${seg}</span>`;
                if(navigator.vibrate) navigator.vibrate(50);
            } 
            else if(est === "JUGANDO") {
                if(document.getElementById('bloqueo').style.display === 'flex') { if(navigator.vibrate) navigator.vibrate(1000); }
                document.getElementById('bloqueo').style.display = 'none';
            }
            else if(est === "ESPERANDO_INICIO") location.reload();
        });

        function cargarJuego() {
            let save = localStorage.getItem('mi_carton_data');
            miMatriz = save ? JSON.parse(save) : generarCarton();
            localStorage.setItem('mi_carton_data', JSON.stringify(miMatriz));
            dibujar(); escucharBolas();
        }

        function generarCarton() {
            let m = Array.from({length: 4}, () => Array(8).fill(null));
            for(let f=0; f<4; f++) {
                let nms = Array.from({length:20}, (_,i)=> i + (f*20)+1).sort(()=>Math.random()-0.5).slice(0,5).sort((a,b)=>a-b);
                let cols = [0,1,2,3,4,5,6,7].sort(()=>Math.random()-0.5).slice(0,5).sort();
                cols.forEach((c,i) => m[f][c] = nms[i]);
            }
            return m;
        }

        function dibujar() {
            const g = document.getElementById('bingo-grid'); g.innerHTML = "";
            miMatriz.forEach((fila, fi) => {
                fila.forEach((num, ci) => {
                    const d = document.createElement('div');
                    d.className = num ? 'cell' : 'cell empty';
                    d.id = `c-${fi}-${ci}`; d.innerText = num || "";
                    if(num) {
                        if(localStorage.getItem(`m_${fi}_${ci}`)) d.classList.add('marked-error');
                        d.onclick = () => marcar(d, fi, ci, num);
                    }
                    g.appendChild(d);
                });
            });
        }

        function marcar(el, fi, ci, num) {
            if(el.classList.contains('marked-ok') || el.classList.contains('marked-error')) {
                el.classList.remove('marked-ok', 'marked-error');
                localStorage.removeItem(`m_${fi}_${ci}`);
            } else {
                el.classList.add(bolasEnJuego.has(num) ? 'marked-ok' : 'marked-error');
                localStorage.setItem(`m_${fi}_${ci}`, "1");
                if(navigator.vibrate) navigator.vibrate(40);
            }
            verificarPremios();
        }

        function escucharBolas() {
            db.ref('bingo/ultimaBola').on('value', snap => {
                const n = snap.val();
                if(n && n !== 0) {
                    bolasEnJuego.add(n);
                    document.getElementById('h-2').innerText = document.getElementById('h-1').innerText;
                    document.getElementById('h-1').innerText = document.getElementById('bola-viva').innerText;
                    document.getElementById('bola-viva').innerText = n;
                    document.querySelectorAll('.marked-error').forEach(c => {
                        if(bolasEnJuego.has(parseInt(c.innerText))) { c.classList.remove('marked-error'); c.classList.add('marked-ok'); }
                    });
                    verificarPremios();
                }
            });
            db.ref('bingo/lineaCantada').on('value', snap => yaHuboLinea = snap.val());
        }

        function verificarPremios() {
            let celdasVerdes = document.querySelectorAll('.marked-ok').length;
            let totalNumeros = document.querySelectorAll('.cell:not(.empty)').length;
            if(celdasVerdes === totalNumeros && totalNumeros > 0) {
                if(navigator.vibrate) navigator.vibrate([500, 100, 500, 100, 500, 100, 2000]);
                db.ref('bingo/estado').set("PAUSA_BINGO");
            } 
            else if(!yaHuboLinea) {
                for(let f=0; f<4; f++) {
                    let ok = 0, total = 0;
                    for(let c=0; c<8; c++) {
                        let val = miMatriz[f][c];
                        if(val) { total++; if(document.getElementById(`c-${f}-${c}`).classList.contains('marked-ok')) ok++; }
                    }
                    if(ok === total && total > 0) {
                        if(navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300, 100, 1000]);
                        db.ref('bingo/estado').set("PAUSA_LINEA");
                        break;
                    }
                }
            }
        }
    </script>
</body>
</html>
