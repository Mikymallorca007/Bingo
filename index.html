<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Master - Bingo 80 bolas</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; }
        .container { width: 80%; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); }
        h1 { color: #ff6600; }
        .player-list { margin-top: 20px; }
        .player { background: #f8f8f8; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; }
        .bingo-card { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            gap: 2px; 
            width: 340px; 
            margin: 10px auto; 
            background: #eee; 
            border-radius: 10px; 
            border: 2px solid black; 
            padding: 10px;
        }
        .cell { 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: white; 
            border-radius: 5px; 
            font-size: 18px; 
            font-weight: bold;
            border: 1px solid black;
        }
        .bombo { 
            background: url('bombo.png') center/contain no-repeat;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel del Master - Bingo 80 bolas</h1>
        <div>
            <label for="numPlayers">Número de jugadores:</label>
            <input type="number" id="numPlayers" min="1" max="100" value="1">
            <button onclick="createPlayers()">Configurar Jugadores</button>
        </div>
        <div class="player-list" id="playerList">
            <!-- Los jugadores y sus cartones aparecerán aquí -->
        </div>
    </div>

    <script>
        function createPlayers() {
            const numPlayers = document.getElementById('numPlayers').value;
            const playerList = document.getElementById('playerList');
            playerList.innerHTML = ''; // Limpiar lista de jugadores

            for (let i = 1; i <= numPlayers; i++) {
                const playerDiv = document.createElement('div');
                playerDiv.classList.add('player');
                playerDiv.innerHTML = ` 
                    <h3>Jugador ${i}</h3>
                    <div class="bingo-card" id="card-${i}">
                        <!-- El cartón de cada jugador se generará aquí -->
                    </div>
                    <a href="Jugador${String(i).padStart(3, '0')}.html">Ver Cartón</a>
                `;
                playerList.appendChild(playerDiv);
                generateBingoCard(i); // Generar el cartón para cada jugador
            }
        }

        function generateBingoCard(playerId) {
            const card = document.getElementById(`card-${playerId}`);
            card.innerHTML = '';
            let numbers = Array(8).fill().map((_, i) => {
                let min = i * 10 + 1;
                let max = i === 7 ? 80 : (i + 1) * 10;
                return Array.from({ length: max - min + 1 }, (_, index) => min + index)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 5) // Cambié a 5 números por columna
                    .sort((a, b) => a - b);
            });

            let bomboPositions = new Set();
            while (bomboPositions.size < 9) bomboPositions.add(Math.floor(Math.random() * 24));

            let cellIndex = 0;
            const cardData = []; // Guardaremos los datos del cartón aquí
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 8; col++) {
                    let cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (bomboPositions.has(cellIndex)) {
                        cell.classList.add('bombo');
                    } else {
                        cell.textContent = numbers[col].length ? numbers[col].shift() : '';
                    }
                    cardData.push(cell.textContent); // Guardar número del cartón
                    card.appendChild(cell);
                    cellIndex++;
                }
            }

            // Guardar el cartón en localStorage para que el jugador lo vea después
            localStorage.setItem(`cartonJugador${playerId}`, JSON.stringify(cardData));
        }
    </script>
</body>
</html>
