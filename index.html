<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JUGADOR - Bingo Aldea Bella</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f0c29">

    <style>
        :root { --bg: #0f0c29; --accent: #00d2ff; --win: #2ecc71; --fail: #e74c3c; }
        * { box-sizing: border-box; touch-action: manipulation; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: linear-gradient(to right, #0f0c29, #302b63, #24243e); 
            color: white; margin: 0; padding: 5px; height: 100vh; width: 100vw; display: flex; overflow: hidden; 
        }
        
        #pantalla-registro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0c29; z-index: 20000; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
        }

        #bloqueo { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #0f0c29; z-index: 15000; 
            display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }

        .icon-status { font-size: 8rem; margin-bottom: 20px; }
        .espera-prohibido { color: var(--fail); }
        .espera-check { color: var(--win); transform: scale(1.2); }

        #contador-bloqueo {
            font-size: 18rem; font-weight: 900; color: white;
            text-shadow: 0 0 40px var(--accent);
            display: none; /* Se activa por JS */
            -webkit-text-stroke: 4px var(--accent);
            z-index: 16000;
        }

        aside { 
            width: 20vw; max-width: 100px; background: rgba(255, 255, 255, 0.1); 
            border-radius: 15px; margin-right: 8px; padding: 10px 5px; display: flex; 
            flex-direction: column; align-items: center; backdrop-filter: blur(5px); flex-shrink: 0;
        }

        main { flex-grow: 1; height: 100%; overflow: hidden; position: relative; }
        .grid-bingo { 
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); 
            gap: 5px; width: 100%; height: 100%; 
        }
        
        .cell { 
            background: white; color: #2c3e50; display: flex; align-items: center; 
            justify-content: center; font-size: 2rem; font-weight: 800; border-radius: 8px; 
            box-shadow: 0 4px 0 #bdc3c7; 
        }
        .cell.empty { background: rgba(255,255,255,0.05); box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }
        .cell.marked-ok { background: var(--win) !important; color: white; box-shadow: 0 4px 0 #27ae60; transform: translateY(2px); }
        .cell.marked-error { background: var(--fail) !important; color: white; box-shadow: 0 4px 0 #c0392b; transform: translateY(2px); }

        .input-nombre { background: rgba(255,255,255,0.1); border: 2px solid var(--accent); border-radius: 15px; padding: 15px; color: white; font-size: 1.5rem; text-align: center; width: 80%; max-width: 400px; margin-bottom: 20px; outline: none; }
        .btn-entrar { background: var(--win); color: white; border: none; padding: 15px 40px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .bola-cantada { background: white; color: #1e272e; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 900; border: 4px solid var(--win); margin-bottom: 10px; }
        .historial { background: rgba(0,0,0,0.3); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 5px; color: #aaa; font-weight: bold; }
    </style>
</head>
<body>

    <div id="pantalla-registro">
        <h1 style="color:var(--accent); margin-bottom:30px;">BINGO ALDEA BELLA</h1>
        <input type="text" id="input-nombre" class="input-nombre" placeholder="TU NOMBRE AQUÍ..." maxlength="12">
        <button class="btn-entrar" onclick="procesarEntrada()">ENTRAR A JUGAR</button>
    </div>

    <div id="bloqueo">
        <div id="icon-container" class="icon-status">🚫</div>
        <h1 id="bloqueo-status" style="font-size: 2rem; color: white; margin: 10px 0;">ESPERANDO...</h1>
        <div id="contador-bloqueo">--</div>
    </div>

    <aside>
        <div id="bola-viva" class="bola-cantada">--</div>
        <div id="h-1" class="historial">--</div>
        <div id="h-2" class="historial">--</div>
    </aside>

    <main>
        <div class="grid-bingo" id="bingo-grid"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCg8YWdMDcv5n1n84ywQr7-9O8ze6KiRJo", databaseURL: "https://bingoaldeabella-default-rtdb.europe-west1.firebasedatabase.app", projectId: "bingoaldeabella" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let miId = localStorage.getItem('aldea_uid') || 'u' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('aldea_uid', miId);
        let miNombre = localStorage.getItem('aldea_nombre');
        let bolasEnJuego = new Set();
        let yaHuboLinea = false;
        let miMatriz = [];
        let idPartidaActual = localStorage.getItem('id_partida_local') || 0;
        let estadoAutorizacion = "pendiente";

        window.onload = () => { if(miNombre) { document.getElementById('pantalla-registro').style.display = 'none'; iniciarConexionFirebase(); } };

        function procesarEntrada() {
            const val = document.getElementById('input-nombre').value.trim().toUpperCase();
            if(val.length < 2) return; 
            miNombre = val;
            localStorage.setItem('aldea_nombre', miNombre);
            document.getElementById('pantalla-registro').style.display = 'none';
            iniciarConexionFirebase();
        }

        function iniciarConexionFirebase() {
            // Lógica de Solicitudes (🚫 y ✅)
            db.ref('bingo/solicitudes/' + miId).on('value', snap => {
                const s = snap.val();
                const b = document.getElementById('bloqueo');
                const icon = document.getElementById('icon-container');
                const statusTxt = document.getElementById('bloqueo-status');

                if(!s) {
                    db.ref('bingo/solicitudes/' + miId).set({ nombre: miNombre, estado: "pendiente", fecha: Date.now() });
                } else {
                    b.style.display = 'flex';
                    estadoAutorizacion = s.estado;
                    if(s.estado === "pendiente") {
                        icon.innerText = "🚫"; icon.className = "icon-status espera-prohibido";
                        statusTxt.innerHTML = `HOLA ${s.nombre}<br><span style="font-size:1.2rem; color:#aaa;">Espera a que te acepten...</span>`;
                    } else if(s.estado === "autorizado") {
                        icon.innerText = "✅"; icon.className = "icon-status espera-check";
                        statusTxt.innerHTML = `¡ACEPTADO!<br><span style="font-size:1.2rem; color:#aaa;">La partida empezará pronto...</span>`;
                        if(miMatriz.length === 0) cargarJuego();
                    }
                }
            });

            // Lógica de Cuenta Atrás (Forzada)
            db.ref('bingo/cuentaAtras').on('value', snap => {
                const seg = snap.val();
                const divCont = document.getElementById('contador-bloqueo');
                const icon = document.getElementById('icon-container');
                const statusTxt = document.getElementById('bloqueo-status');
                const b = document.getElementById('bloqueo');

                if (seg > 0) {
                    // MODO CUENTA ATRÁS ACTIVO
                    b.style.display = 'flex';
                    icon.style.display = 'none';
                    statusTxt.style.display = 'none';
                    divCont.style.display = 'block';
                    divCont.innerText = seg;
                } else {
                    // MODO JUEGO O ESPERA
                    divCont.style.display = 'none';
                    if(estadoAutorizacion === "autorizado") {
                        b.style.display = 'none'; // Quitar bloqueo para jugar
                    } else {
                        // Volver a mostrar iconos si no está autorizado
                        icon.style.display = 'block';
                        statusTxt.style.display = 'block';
                    }
                }
            });

            escucharBolas();
            
            db.ref('bingo/idPartida').on('value', snap => {
                const idServidor = snap.val();
                if (idServidor && idServidor != idPartidaActual) {
                    localStorage.clear();
                    localStorage.setItem('aldea_uid', miId);
                    localStorage.setItem('aldea_nombre', miNombre);
                    localStorage.setItem('id_partida_local', idServidor);
                    window.location.reload(true);
                }
            });
        }

        function cargarJuego() {
            let storage = localStorage.getItem('mi_carton_data');
            if(storage) { miMatriz = JSON.parse(storage); } 
            else { miMatriz = generarCarton(); localStorage.setItem('mi_carton_data', JSON.stringify(miMatriz)); }
            dibujar();
        }

        function generarCarton() {
            let matriz = Array.from({length: 4}, () => Array(8).fill(true));
            for (let f = 0; f < 4; f++) {
                let huecos = 0; let intentos = 0;
                while (huecos < 3 && intentos < 200) {
                    intentos++; let c = Math.floor(Math.random() * 8);
                    if (matriz[f][c] === true) {
                        if (c > 1 && matriz[f][c-1] === null && matriz[f][c-2] === null) continue;
                        if (c < 6 && matriz[f][c+1] === null && matriz[f][c+2] === null) continue;
                        if (f > 1 && matriz[f-1][c] === null && matriz[f-2][c] === null) continue;
                        if (f < 2 && matriz[f+1][c] === null && matriz[f+2][c] === null) continue;
                        matriz[f][c] = null; huecos++;
                    }
                }
                if (huecos < 3) return generarCarton();
            }
            for (let c = 0; c < 8; c++) {
                let min = (c * 10) + 1; let max = (c * 10) + 10;
                let numerosCol = []; for (let i = min; i <= max; i++) numerosCol.push(i);
                numerosCol.sort(() => Math.random() - 0.5);
                let vals = [];
                for (let f = 0; f < 4; f++) if (matriz[f][c] === true) vals.push(numerosCol.pop());
                vals.sort((a, b) => a - b);
                let vIdx = 0;
                for (let f = 0; f < 4; f++) if (matriz[f][c] === true) matriz[f][c] = vals[vIdx++];
            }
            return matriz;
        }

        function dibujar() {
            const g = document.getElementById('bingo-grid'); g.innerHTML = "";
            miMatriz.forEach((fila, fi) => {
                fila.forEach((num, ci) => {
                    const d = document.createElement('div');
                    d.className = num ? 'cell' : 'cell empty';
                    d.id = `c-${fi}-${ci}`; d.innerText = num || "";
                    if(num) {
                        if(localStorage.getItem(`m_${fi}_${ci}`)) d.classList.add(bolasEnJuego.has(num) ? 'marked-ok' : 'marked-error');
                        d.onclick = () => marcar(d, fi, ci, num);
                    }
                    g.appendChild(d);
                });
            });
        }

        function marcar(el, fi, ci, num) {
            if(el.classList.contains('marked-ok') || el.classList.contains('marked-error')) {
                el.classList.remove('marked-ok', 'marked-error');
                localStorage.removeItem(`m_${fi}_${ci}`);
            } else {
                el.classList.add(bolasEnJuego.has(num) ? 'marked-ok' : 'marked-error');
                localStorage.setItem(`m_${fi}_${ci}`, "1");
                if(navigator.vibrate) navigator.vibrate(40);
            }
            verificarPremios();
        }

        function escucharBolas() {
            db.ref('bingo/ultimaBola').on('value', snap => {
                const n = snap.val();
                if(n && n !== 0) {
                    bolasEnJuego.add(n);
                    const v = document.getElementById('bola-viva').innerText;
                    if(n.toString() !== v) {
                        document.getElementById('h-2').innerText = document.getElementById('h-1').innerText;
                        document.getElementById('h-1').innerText = v;
                        document.getElementById('bola-viva').innerText = n;
                        document.querySelectorAll('.marked-error').forEach(c => {
                            if(bolasEnJuego.has(parseInt(c.innerText))) c.classList.replace('marked-error', 'marked-ok'); 
                        });
                        verificarPremios();
                    }
                }
            });
            db.ref('bingo/lineaCantada').on('value', snap => yaHuboLinea = snap.val());
        }

        function verificarPremios() {
            let celdasVerdes = document.querySelectorAll('.marked-ok').length;
            let totalNumerosEnCarton = 0;
            miMatriz.forEach(f => f.forEach(c => { if(c) totalNumerosEnCarton++; }));
            if(celdasVerdes === totalNumerosEnCarton && totalNumerosEnCarton > 0) {
                db.ref('bingo/avisoPremio').set({ nombre: miNombre, tipo: "BINGO" });
                db.ref('bingo/estado').set("PAUSA_BINGO");
            } else if(!yaHuboLinea) {
                for(let f=0; f<4; f++) {
                    let ok = 0; let numEnFila = 0; let numerosLinea = [];
                    for(let c=0; c<8; c++) {
                        if(miMatriz[f][c]) {
                            numEnFila++; numerosLinea.push(miMatriz[f][c]);
                            if(document.getElementById(`c-${f}-${c}`).classList.contains('marked-ok')) ok++;
                        }
                    }
                    if(ok === numEnFila && numEnFila > 0) {
                        db.ref('bingo/avisoPremio').set({ nombre: miNombre, tipo: "LINEA", numeros: numerosLinea.join(", ") });
                        db.ref('bingo/estado').set("PAUSA_LINEA");
                        break;
                    }
                }
            }
        }
    </script>
</body>
</html>
