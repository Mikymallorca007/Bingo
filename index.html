<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bingo</title>
    <style>
        /* Estilos para el cartón del master */
    </style>
</head>
<body>
    <h1>Cartón de Bingo del Jugador</h1>
    <div id="cartonMaster"></div>

    <button id="generarCarton">Generar Cartón</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Recibir el cartón del jugador
        socket.on('cartonParaMaster', (carton) => {
            mostrarCartonMaster(carton);
        });

        // Mostrar el cartón en la vista del master
        function mostrarCartonMaster(carton) {
            const divCarton = document.getElementById('cartonMaster');
            divCarton.innerHTML = ''; // Limpiar el div

            carton.forEach(fila => {
                const filaDiv = document.createElement('div');
                fila.forEach(num => {
                    const casilla = document.createElement('div');
                    casilla.textContent = num;
                    casilla.classList.add('casilla');
                    filaDiv.appendChild(casilla);
                });
                divCarton.appendChild(filaDiv);
            });
        }

        // Generar un cartón para el jugador al hacer clic en el botón
        document.getElementById('generarCarton').addEventListener('click', () => {
            socket.emit('generarCarton');
        });
    </script>
</body>
</html>
