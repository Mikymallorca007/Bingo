<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MULTISERVICIOS - JEFE</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; text-transform: uppercase; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; background: #1e1e1e; padding: 25px; border-radius: 20px; }
        h2 { color: #00d4ff; text-align: center; letter-spacing: 2px; }
        label { display: block; margin-top: 15px; color: #aaa; font-size: 0.8rem; }
        input, select { width: 100%; padding: 15px; margin-top: 5px; border-radius: 10px; border: none; background: #333; color: white; font-size: 1rem; }
        button { width: 100%; padding: 18px; margin-top: 25px; border-radius: 10px; border: none; background: #00d4ff; color: #121212; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PANEL MASTER</h2>
        <label>TRABAJADOR:</label>
        <select id="worker"><option value="pedro">PEDRO</option></select>
        <label>CLIENTE:</label>
        <input type="text" id="cliente" placeholder="NOMBRE DEL CLIENTE">
        <label>TAREA:</label>
        <input type="text" id="tarea" placeholder="DESCRIPCIÓN DEL TRABAJO">
        <button onclick="enviarOrden()">ENVIAR ORDEN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDhO3xeBoLKe3ZEEOUl-T-vpPZXT2yI9X8",
            authDomain: "tokentest-87f09.firebaseapp.com",
            databaseURL: "https://tokentest-87f09-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tokentest-87f09",
            storageBucket: "tokentest-87f09.firebasestorage.app",
            messagingSenderId: "973211096919",
            appId: "1:973211096919:web:0140870d7fe8d86539d012"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // IMPORTANTE: Para que el envío funcione, necesitas tu SERVER KEY de Firebase Console
        // Se encuentra en: Configuración del proyecto > Cloud Messaging > Cloud Messaging API (Legacy)
        const SERVER_KEY = "TU_SERVER_KEY_AQUÍ";

        function enviarOrden() {
            const worker = document.getElementById('worker').value;
            const cli = document.getElementById('cliente').value;
            const tar = document.getElementById('tarea').value;

            if(!cli || !tar) return alert("RELLENA TODOS LOS CAMPOS");

            // 1. Guardar en la Base de Datos
            db.ref('trabajadores/' + worker + '/servicio_actual').set({
                cliente: cli, 
                tarea: tar, 
                estado: "pendiente", 
                timestamp: Date.now()
            }).then(() => {
                // 2. Intentar disparar la notificación Push
                notificarAlTrabajador(worker, cli, tar);
                
                alert("ORDEN ENVIADA EXITOSAMENTE");
                document.getElementById('cliente').value = "";
                document.getElementById('tarea').value = "";
            });
        }

        function notificarAlTrabajador(worker, cli, tar) {
            // Buscamos el token de Pedro
            db.ref('trabajadores/' + worker + '/token').once('value').then((snap) => {
                const token = snap.val();
                if (!token) {
                    console.log("EL TRABAJADOR NO TIENE TOKEN ACTIVO");
                    return;
                }

                // Construcción del mensaje para Firebase Cloud Messaging
                const payload = {
                    notification: {
                        title: "⚠️ NUEVA ORDEN: " + cli,
                        body: tar,
                        sound: "default",
                        click_action: "https://TU_URL_DE_LA_APP/trabajadores.html"
                    },
                    to: token
                };

                // Envío de la notificación vía Fetch
                fetch('https://fcm.googleapis.com/fcm/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'key=' + SERVER_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                })
                .then(response => console.log("PUSH ENVIADO CON ÉXITO"))
                .catch(error => console.error("ERROR AL ENVIAR PUSH:", error));
            });
        }
    </script>
</body>
</html>
