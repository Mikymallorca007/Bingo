<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mando - Bingo Aldea Bella</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .bola-display { width: 140px; height: 140px; background: white; color: #1a1a2e; border-radius: 50%; 
                        display: flex; align-items: center; justify-content: center; font-size: 70px; 
                        margin: 30px auto; font-weight: bold; border: 8px solid #2ecc71; }
        button { width: 100%; padding: 25px; font-size: 22px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; }
        .btn-start { background: #2ecc71; color: white; }
        .btn-pause { background: #e94560; color: white; }
        #historial { margin-top: 30px; color: #95a5a6; font-size: 16px; text-align: left; }
    </style>
</head>
<body>
    <h1>Bingo Aldea Bella</h1>
    <div class="bola-display" id="bola">--</div>
    <button id="btnControl" class="btn-start" onclick="toggleBingo()">INICIAR BINGO (3s)</button>
    <div id="historial">Bolas: </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCg8YWdMDcv5n1n84ywQr7-9O8ze6KiRJo",
            authDomain: "bingoaldeabella.firebaseapp.com",
            databaseURL: "https://bingoaldeabella-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bingoaldeabella",
            storageBucket: "bingoaldeabella.firebasestorage.app",
            messagingSenderId: "911712071246",
            appId: "1:911712071246:web:52e2f5edb30e0372471d1f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let bombo = Array.from({length: 80}, (_, i) => i + 1);
        let jugando = false;
        let timer;

        function toggleBingo() {
            const btn = document.getElementById('btnControl');
            if (!jugando) {
                jugando = true;
                btn.innerText = "PAUSAR (BINGO!)";
                btn.className = "btn-pause";
                sacarBola();
            } else {
                jugando = false;
                btn.innerText = "CONTINUAR JUEGO";
                btn.className = "btn-start";
                clearTimeout(timer);
            }
        }

        function sacarBola() {
            if (jugando && bombo.length > 0) {
                const index = Math.floor(Math.random() * bombo.length);
                const bola = bombo.splice(index, 1)[0];
                
                document.getElementById('bola').innerText = bola;
                document.getElementById('historial').innerText += bola + " - ";
                
                // MANDA EL DATO A FIREBASE
                db.ref('bingo/ultimaBola').set(bola);

                timer = setTimeout(sacarBola, 3000);
            }
        }
    </script>
</body>
</html>
