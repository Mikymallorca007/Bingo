<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MASTER - Bingo Aldea Bella</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e272e">

    <style>
        :root { 
            --bg: #1e272e; --panel: #2f3542; --accent: #2ecc71; 
            --error: #e74c3c; --bingo: #f1c40f; --blue: #3498db; --text: #ffffff;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); 
            color: var(--text); margin: 0; display: flex; height: 100vh; width: 100vw; overflow: hidden; 
        }

        /* OVERLAY PARA CUENTA ATRÁS */
        #countdown-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center;
            justify-content: center; color: white; font-size: 15rem; font-weight: 900;
            z-index: 20000; text-shadow: 0 0 30px var(--accent);
        }

        aside { width: 300px; background: var(--panel); display: flex; flex-direction: column; border-right: 2px solid #3f4452; }
        .header-aside { padding: 20px; text-align: center; border-bottom: 1px solid #3f4452; }
        
        #lista-solicitudes { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .card-user { 
            background: #3f4452; margin-bottom: 10px; padding: 12px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity:0; transform: translateX(-10px); } to { opacity:1; transform: translateX(0); } }

        .btn-check { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-del { background: var(--error); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-left: 5px; }

        main { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; position: relative; }
        
        .bombo-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #bola-grande { 
            width: 220px; height: 220px; background: white; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem; font-weight: 900; color: #1e272e;
            border: 15px solid var(--accent); box-shadow: 0 0 50px rgba(46, 204, 113, 0.3);
            margin-bottom: 30px;
        }

        .controles { display: flex; gap: 15px; justify-content: center; }
        .btn-main { 
            padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border: none; 
            border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        #btn-start { background: var(--accent); color: white; }
        #btn-reset { background: var(--error); color: white; }

        .panel-bolas { 
            display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; 
            margin-top: 30px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;
        }
        .bola-mini { 
            aspect-ratio: 1; background: #3f4452; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: bold; color: rgba(255,255,255,0.3);
        }
        .bola-mini.active { background: var(--accent); color: white; box-shadow: 0 0 10px var(--accent); }

        /* ALERTAS DE PREMIO */
        .alerta {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--bingo); color: #000; padding: 40px; border-radius: 20px;
            text-align: center; z-index: 1000; display: none; box-shadow: 0 0 100px rgba(0,0,0,0.5);
            width: 80%;
        }
    </style>
</head>
<body>

    <div id="countdown-overlay">10</div>

    <aside>
        <div class="header-aside">
            <h2 style="margin:0; color:var(--accent)">JUGADORES</h2>
            <small id="contador-users">0 conectados</small>
        </div>
        <div id="lista-solicitudes"></div>
        <button onclick="nuevaPartida()" id="btn-reset" class="btn-main" style="margin: 10px; font-size: 0.9rem; padding: 10px;">RESETEAR TODO</button>
    </aside>

    <main>
        <div id="aviso-linea" class="alerta">
            <h1 style="font-size: 3rem; margin:0;">¡LÍNEA!</h1>
            <h2 id="ganador-linea">---</h2>
            <p id="numeros-linea" style="font-weight: bold; font-size: 1.2rem;"></p>
            <button class="btn-main" onclick="validarPremio(true)" style="background:#000; color:#fff">VALIDAR Y SEGUIR</button>
            <button class="btn-main" onclick="validarPremio(false)" style="background:var(--error); color:#fff; margin-left:10px;">FALSA</button>
        </div>

        <div id="aviso-bingo" class="alerta">
            <h1 style="font-size: 4rem; margin:0;">¡BINGO!</h1>
            <h2 id="ganador-bingo">---</h2>
            <button class="btn-main" onclick="location.reload()" style="background:#000; color:#fff">NUEVA PARTIDA</button>
        </div>

        <div class="bombo-container">
            <div id="bola-grande">--</div>
            <div class="controles">
                <button id="btn-start" class="btn-main" onclick="comenzarPartida()">INICIAR BINGO</button>
            </div>
        </div>

        <div class="panel-bolas" id="panel-bolas"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCg8YWdMDcv5n1n84ywQr7-9O8ze6KiRJo", databaseURL: "https://bingoaldeabella-default-rtdb.europe-west1.firebasedatabase.app", projectId: "bingoaldeabella" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let bolasExtraidas = [];
        let jugando = false;
        let timerBingo;
        let intervaloVelocidad = 4000; 

        // Generar panel 1-80
        const panel = document.getElementById('panel-bolas');
        for(let i=1; i<=80; i++) {
            let d = document.createElement('div');
            d.className = 'bola-mini'; d.id = `mini-${i}`; d.innerText = i;
            panel.appendChild(d);
        }

        // LÓGICA DE JUGADORES
        db.ref('bingo/solicitudes').on('value', snap => {
            const list = document.getElementById('lista-solicitudes');
            list.innerHTML = "";
            let count = 0;
            snap.forEach(child => {
                const u = child.val();
                if(u.estado === "pendiente") {
                    list.innerHTML += `
                        <div class="card-user">
                            <span>${u.nombre}</span>
                            <div>
                                <button class="btn-check" onclick="aceptar('${child.key}')">✔</button>
                                <button class="btn-del" onclick="eliminar('${child.key}')">✖</button>
                            </div>
                        </div>`;
                }
                count++;
            });
            document.getElementById('contador-users').innerText = count + " conectados";
        });

        function aceptar(id) { db.ref('bingo/solicitudes/'+id).update({ estado: "autorizado" }); }
        function eliminar(id) { db.ref('bingo/solicitudes/'+id).remove(); }

        // LÓGICA DE JUEGO
        function comenzarPartida() {
            let segundos = 10;
            const overlay = document.getElementById('countdown-overlay');
            if(!overlay) return; // Seguridad
            
            overlay.style.display = 'flex';
            document.getElementById('btn-start').disabled = true;

            let countdown = setInterval(() => {
                overlay.innerText = segundos;
                db.ref('bingo/estado').set("CUENTA_" + segundos);
                
                if (segundos === 0) {
                    clearInterval(countdown);
                    overlay.style.display = 'none';
                    db.ref('bingo/estado').set("JUGANDO");
                    
                    // RETRASO DE 5 SEGUNDOS PARA LA PRIMERA BOLA
                    setTimeout(() => {
                        intervaloVelocidad = 4000; // Siguientes cada 4s
                        jugando = true;
                        sacarBola(); 
                    }, 5000);
                }
                segundos--;
            }, 1000);
        }

        function sacarBola() {
            if(!jugando) return;
            if(bolasExtraidas.length >= 80) return;

            let n;
            do { n = Math.floor(Math.random() * 80) + 1; } while(bolasExtraidas.includes(n));
            
            bolasExtraidas.push(n);
            db.ref('bingo/ultimaBola').set(n);
            
            document.getElementById('bola-grande').innerText = n;
            document.getElementById(`mini-${n}`).classList.add('active');

            timerBingo = setTimeout(sacarBola, intervaloVelocidad);
        }

        function toggleJuego() {
            if(jugando) {
                jugando = false;
                clearTimeout(timerBingo);
            } else {
                jugando = true;
                sacarBola();
            }
        }

        // PREMIOS
        db.ref('bingo/avisoPremio').on('value', snap => {
            const p = snap.val();
            if(p) {
                jugando = false;
                clearTimeout(timerBingo);
                if(p.tipo === "LINEA") {
                    document.getElementById('ganador-linea').innerText = p.nombre;
                    document.getElementById('numeros-linea').innerText = "NÚMEROS: " + p.numeros;
                    document.getElementById('aviso-linea').style.display = 'block';
                } else {
                    document.getElementById('ganador-bingo').innerText = p.nombre;
                    document.getElementById('aviso-bingo').style.display = 'block';
                }
            }
        });

        function validarPremio(esValido) {
            if(esValido) db.ref('bingo/lineaCantada').set(true);
            db.ref('bingo/avisoPremio').remove();
            db.ref('bingo/estado').set("JUGANDO");
            document.querySelectorAll('.alerta').forEach(a => a.style.display = 'none');
            jugando = true;
            sacarBola();
        }

        function nuevaPartida() {
            if(confirm("¿Resetear todo el Bingo?")) {
                db.ref('bingo').set({
                    estado: "ESPERANDO_INICIO",
                    ultimaBola: 0,
                    lineaCantada: false,
                    idPartida: Date.now()
                }).then(() => location.reload());
            }
        }
    </script>
</body>
</html>
