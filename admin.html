<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER - Bingo Aldea Bella</title>
    <style>
        :root { 
            --bg: #1e272e; --panel: #2f3542; --accent: #2ecc71; 
            --error: #e74c3c; --bingo: #f1c40f; --blue: #3498db; --text: #ffffff;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); 
            color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; 
        }
        
        aside { 
            width: 320px; background: var(--panel); padding: 20px; display: flex; 
            flex-direction: column; border-right: 2px solid #485460; align-items: center; flex-shrink: 0; 
        }
        
        .bola-principal { 
            width: 140px; height: 140px; background: white; color: var(--bg); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 4.5rem; font-weight: 900; margin: 20px 0; border: 8px solid var(--accent); 
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.4); position: relative;
        }

        #count-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); border-radius: 50%; display: none;
            align-items: center; justify-content: center; font-size: 5rem;
            color: var(--bingo); z-index: 10; animation: pulse 0.5s infinite alternate;
        }
        
        button { 
            width: 100%; padding: 18px; margin-bottom: 12px; border: none; 
            border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; 
            transition: 0.2s;
        }

        .btn-play { background: var(--accent); color: white; }
        .btn-stop { background: var(--error); color: white; }
        .btn-access { background: var(--blue); color: white; position: relative; }
        .badge { 
            position: absolute; top: -8px; right: -8px; background: var(--error); 
            color: white; padding: 6px 12px; border-radius: 50%; display: none; border: 2px solid white; 
        }
        .btn-reset { background: #ffa502; color: white; margin-top: auto; }

        main { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; }
        .grid-master { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; 
            background: #2f3542; padding: 20px; border-radius: 20px; flex-grow: 1; 
        }
        .num-slot { 
            background: #485460; color: #a4b0be; display: flex; align-items: center; 
            justify-content: center; border-radius: 10px; font-weight: bold; font-size: 1.6rem; 
        }
        .num-slot.out { background: var(--accent); color: white; transform: scale(1.08); box-shadow: 0 0 15px rgba(46, 204, 113, 0.6); }

        #modal-acceso { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; 
        }
        .modal-content { 
            background: #2f3542; width: 95%; max-width: 650px; max-height: 85vh; 
            border-radius: 25px; padding: 30px; border: 3px solid var(--blue); 
        }
        .user-list { overflow-y: auto; margin-top: 25px; }
        .user-row { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #1e272e; padding: 15px 20px; margin-bottom: 12px; border-radius: 15px; 
            font-size: 1.4rem; border-left: 6px solid var(--blue);
        }
        .btn-ok { background: var(--accent); color: white; padding: 10px; border-radius: 8px; width: auto; margin:0;}
        .btn-kick { background: var(--error); color: white; padding: 10px; border-radius: 8px; width: auto; margin:0; margin-left: 10px; }

        .alerta { padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: bold; font-size: 1.6rem; display: none; }
        #aviso-linea { background: var(--error); color: white; border: 3px solid white; }
        #aviso-bingo { background: var(--bingo); color: #1e272e; border: 4px solid white; }
        
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="modal-acceso">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #485460; padding-bottom: 20px;">
                <h2 style="margin:0; color:var(--blue)">CONTROL DE ENTRADA</h2>
                <button style="width:auto; padding:10px 25px; background:#485460; margin:0;" onclick="toggleAcceso()">CERRAR</button>
            </div>
            <div id="lista-espera" class="user-list"></div>
        </div>
    </div>

    <aside>
        <h2 style="margin:0; color:var(--accent)">ALDEA MASTER</h2>
        <div id="aviso-linea" class="alerta">⚠️ LÍNEA CANTADA</div>
        <div id="aviso-bingo" class="alerta">🏆 BINGO RECLAMADO 🏆</div>

        <div class="bola-principal">
            <div id="count-overlay">10</div>
            <span id="bola-actual">--</span>
        </div>

        <button id="btn-start" class="btn-play" onclick="comenzarPartida()">INICIAR BINGO</button>
        
        <div id="zona-validacion" style="display:none; width:100%;">
            <button style="background:var(--accent); color:white;" onclick="resolverPremio(true)">✅ VALIDAR PREMIO</button>
            <button style="background:#e67e22; color:white;" onclick="resolverPremio(false)">❌ FALSO / SEGUIR</button>
        </div>

        <button class="btn-access" onclick="toggleAcceso()">
            👤 JUGADORES
            <span id="badge-count" class="badge">0</span>
        </button>

        <button class="btn-reset" onclick="nuevaPartida()">NUEVA PARTIDA</button>
    </aside>

    <main><div class="grid-master" id="tabla-80"></div></main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCg8YWdMDcv5n1n84ywQr7-9O8ze6KiRJo", databaseURL: "https://bingoaldeabella-default-rtdb.europe-west1.firebasedatabase.app", projectId: "bingoaldeabella" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let bombo = Array.from({length: 80}, (_, i) => i + 1);
        let jugando = false;
        let timerBingo;

        for(let i=1; i<=80; i++) {
            let d = document.createElement('div');
            d.className = 'num-slot'; d.id = 'n-' + i; d.innerText = i;
            document.getElementById('tabla-80').appendChild(d);
        }

        function comenzarPartida() {
            if (jugando) { toggleJuego(); return; }
            let segundos = 10;
            const overlay = document.getElementById('count-overlay');
            overlay.style.display = 'flex';
            document.getElementById('btn-start').disabled = true;

            let countdown = setInterval(() => {
                overlay.innerText = segundos;
                db.ref('bingo/estado').set("CUENTA_" + segundos);
                if (segundos === 0) {
                    clearInterval(countdown);
                    overlay.style.display = 'none';
                    document.getElementById('btn-start').disabled = false;
                    db.ref('bingo/estado').set("JUGANDO");
                    toggleJuego();
                }
                segundos--;
            }, 1000);
        }

        db.ref('bingo/solicitudes').on('value', snap => {
            const list = document.getElementById('lista-espera');
            const badge = document.getElementById('badge-count');
            list.innerHTML = ""; let count = 0;
            const data = snap.val();
            if(data) {
                Object.keys(data).forEach(uid => {
                    if(data[uid].estado === "pendiente") {
                        count++;
                        let row = document.createElement('div');
                        row.className = 'user-row';
                        row.innerHTML = `<span>${data[uid].nombre}</span><div><button class="btn-ok" onclick="admitir('${uid}')">OK</button><button class="btn-kick" onclick="expulsar('${uid}')">X</button></div>`;
                        list.appendChild(row);
                    }
                });
            }
            badge.innerText = count; badge.style.display = count > 0 ? "block" : "none";
        });

        function toggleAcceso() { const m = document.getElementById('modal-acceso'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
        function admitir(uid) { db.ref('bingo/solicitudes/' + uid).update({ estado: "autorizado" }); }
        function expulsar(uid) { if(confirm("¿Expulsar?")) db.ref('bingo/solicitudes/' + uid).remove(); }

        db.ref('bingo/estado').on('value', snap => {
            const est = snap.val();
            if(est === "PAUSA_LINEA") mostrarAviso('aviso-linea');
            else if(est === "PAUSA_BINGO") mostrarAviso('aviso-bingo');
        });

        function toggleJuego() {
            jugando = !jugando;
            const btn = document.getElementById('btn-start');
            btn.innerText = jugando ? "PAUSAR" : "CONTINUAR";
            btn.className = jugando ? "btn-stop" : "btn-play";
            if(jugando) cicloBola(); else clearTimeout(timerBingo);
        }

        function mostrarAviso(id) {
            jugando = false; clearTimeout(timerBingo);
            document.getElementById(id).style.display = 'block';
            document.getElementById('zona-validacion').style.display = 'block';
            document.getElementById('btn-start').style.display = 'none';
        }

        function cicloBola() {
            if(!jugando || bombo.length === 0) return;
            const num = bombo.splice(Math.floor(Math.random() * bombo.length), 1)[0];
            document.getElementById('bola-actual').innerText = num;
            document.getElementById('n-' + num).classList.add('out');
            db.ref('bingo/ultimaBola').set(num);
            timerBingo = setTimeout(cicloBola, 3000);
        }

        function resolverPremio(esValido) {
            if(esValido && document.getElementById('aviso-linea').style.display === 'block') db.ref('bingo/lineaCantada').set(true);
            db.ref('bingo/estado').set("JUGANDO");
            document.querySelectorAll('.alerta').forEach(a => a.style.display = 'none');
            document.getElementById('zona-validacion').style.display = 'none';
            document.getElementById('btn-start').style.display = 'block';
            toggleJuego();
        }

        function nuevaPartida() {
            if(confirm("¿Resetear?")) {
                db.ref('bingo/ultimaBola').set(0);
                db.ref('bingo/estado').set("ESPERANDO_INICIO");
                db.ref('bingo/lineaCantada').set(false);
                db.ref('bingo/solicitudes').once('value', snap => {
                    const d = snap.val();
                    if(d) {
                        let up = {};
                        Object.keys(d).forEach(u => up[`bingo/solicitudes/${u}/estado`] = "pendiente");
                        db.ref().update(up).then(() => location.reload());
                    } else location.reload();
                });
            }
        }
    </script>
</body>
</html>
